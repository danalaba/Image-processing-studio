# Docker service IPs can change when a backend container is recreated.
resolver 127.0.0.11 valid=5s ipv6=off;

log_format studio '$remote_addr "$request_method $uri" $status '
                  'upstream=$upstream_addr instance=$upstream_http_x_instance_id';

upstream studio_api {
    zone studio_api 64k;
    server api-1:8000 resolve max_fails=1 fail_timeout=5s;
    server api-2:8000 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log studio;

    # The application enforces the exact 30 MiB + 64 KiB multipart limit.
    client_max_body_size 31m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    add_header X-Load-Balancer nginx always;

    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"detail":"Запит завеликий. Максимум 30 MiB фото на пакет."}';
    }

    location / {
        proxy_pass http://studio_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Overwrite client-supplied forwarding headers at the trusted edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # Never enable non_idempotent retries: a sent POST may already be committed.
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 2;
    }
}
